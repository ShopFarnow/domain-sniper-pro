name: Domain Sniper PRO v6

on:
  schedule:
    - cron: "30 2 * * *"      # 8:00 AM IST daily
  workflow_dispatch:

env:
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
  GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
  SHEET_NAME: "DomainSniperV6"
  MIN_ALERT_SCORE: "68"
  SAFE_BROWSING_KEY: ${{ secrets.SAFE_BROWSING_KEY }}
  EMAIL_DIGEST_TO: ${{ secrets.EMAIL_DIGEST_TO }}
  GMAIL_USER: ${{ secrets.GMAIL_USER }}
  GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
  AFFILIATE_ID_GD: ${{ secrets.AFFILIATE_ID_GD }}
  AFFILIATE_ID_NC: ${{ secrets.AFFILIATE_ID_NC }}
  REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
  REDDIT_SECRET: ${{ secrets.REDDIT_SECRET }}
  NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
  DB_PATH: "domain_sniper_v6.db"
  MAX_WORKERS: "3"
  SCORE_FLOOR: "45"

jobs:
  snipe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore SQLite DB (persistence)
        uses: actions/cache@v4
        with:
          path: domain_sniper_v6.db
          key: sniper-db-v6-persistent
          restore-keys: sniper-db-v6-persistent

      - name: Upgrade pip & setuptools
        run: pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Domain Sniper PRO v6
        run: python domain_sniper_pro_v6.py

      - name: Upload CSV output
        uses: actions/upload-artifact@v4
        with:
          name: domain-sniper-v6-latest
          path: domains_v6_*.csv

      - name: Save DB cache
        uses: actions/cache@v4
        with:
          path: domain_sniper_v6.db
          key: sniper-db-v6-persistent
