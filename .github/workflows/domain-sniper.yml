name: Domain Sniper PRO (Zero Investment)

on:
  schedule:
    - cron: "30 2 * * *"      # 8:00 AM IST daily (2:30 UTC)
  workflow_dispatch:           # manual trigger

env:
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
  GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
  SHEET_NAME: "DomainSniperPro"
  MIN_ALERT_SCORE: "70"
  SAFE_BROWSING_KEY: ${{ secrets.SAFE_BROWSING_KEY }}
  EMAIL_DIGEST_TO: ${{ secrets.EMAIL_DIGEST_TO }}
  GMAIL_USER: ${{ secrets.GMAIL_USER }}
  GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
  AFFILIATE_ID_GD: ${{ secrets.AFFILIATE_ID_GD }}
  AFFILIATE_ID_NC: ${{ secrets.AFFILIATE_ID_NC }}
  DB_PATH: "domain_sniper.db"

jobs:
  snipe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore SQLite DB (persistence)
        uses: actions/cache@v4
        with:
          path: domain_sniper.db
          key: sniper-db-${{ github.run_id }}
          restore-keys: sniper-db-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Domain Sniper PRO
        run: python domain_sniper_pro.py
      - name: Upload CSV output
        uses: actions/upload-artifact@v4
        with:
          name: domain-sniper-latest
          path: domains_*.csv
      - name: Save DB cache
        uses: actions/cache@v4
        with:
          path: domain_sniper.db
          key: sniper-db-${{ github.run_id }}
