name: Domain Sniper Hybrid

on:
  schedule:
    - cron: "30 2 * * *"      # 8:00 AM IST daily
  workflow_dispatch:

env:
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
  GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
  SHEET_NAME: "DomainSniperHybrid"
  MIN_ALERT_SCORE: "68"
  SAFE_BROWSING_KEY: ${{ secrets.SAFE_BROWSING_KEY }}
  EMAIL_DIGEST_TO: ${{ secrets.EMAIL_DIGEST_TO }}
  GMAIL_USER: ${{ secrets.GMAIL_USER }}
  GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
  AFFILIATE_ID_GD: ${{ secrets.AFFILIATE_ID_GD }}
  AFFILIATE_ID_NC: ${{ secrets.AFFILIATE_ID_NC }}
  DB_PATH: "domain_sniper_hybrid.db"
  MAX_WORKERS: "4"
  NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
  KELLY_BANKROLL: "10000"
  USPTO_SEARCH: "0"
  MAX_DOMAINS: "300"

jobs:
  snipe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore SQLite DB
        uses: actions/cache@v4
        with:
          path: domain_sniper_hybrid.db
          key: hybrid-db-persistent
          restore-keys: hybrid-db-persistent
      - name: Upgrade pip & setuptools
        run: pip install --upgrade pip setuptools wheel
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Domain Sniper Hybrid
        run: python domain_sniper_hybrid.py
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: domain-sniper-hybrid
          path: |
            domains_hybrid_*.csv
            report_hybrid_*.html
      - name: Save DB cache
        uses: actions/cache@v4
        with:
          path: domain_sniper_hybrid.db
          key: hybrid-db-persistent
